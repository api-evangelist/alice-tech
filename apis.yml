aid: alice-tech
name: ALICE Technologies
description: >-
  ALICE Technologies is a Menlo Park, California construction technology
  company that builds an AI-driven generative scheduling and construction
  optioneering platform. The product simulates millions of possible
  construction sequences for a project — varying crews, equipment, methods,
  and constraints — to find optimal schedules, accelerate timelines, recover
  delayed projects, and de-risk capital project delivery. ALICE's suite
  includes ALICE Optimize (generative scheduling from imported Primavera P6
  or Microsoft Project schedules), ALICE Plan (a 2D visual planning canvas
  overlaid on drawings), ALICE Model (BIM-driven schedule generation from
  3D models), and the Schedule Insights Agent (an LLM-powered conversational
  interface for analysing and recommending schedule changes, including
  automated DCMA 14-point schedule quality scoring). The platform is sold
  as SaaS to general contractors, owners and developers, and consultants
  working on industrial (data centres, energy, semiconductors),
  infrastructure (rail, highway, tunnels), and commercial projects, with
  reported impacts including up to 17% reduction in project duration and
  14% labor cost savings. ALICE was founded in 2015 by René Morkos
  (Stanford PhD) and is backed by Merus Capital, Foundamental, Future
  Ventures, Lightspeed, Blackhorn Ventures, and Brick and Mortar; in 2026
  it announced a formal alliance with McKinsey to deploy generative
  scheduling on capital projects. ALICE integrates by importing from
  Primavera P6, Primavera Cloud, Microsoft Project, and BIM/drawing
  formats, but does not publish a public developer API, SDK, or
  open-source repository — integration is delivered via the product's
  import/export surface and customer-success engagements.
